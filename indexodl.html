<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>My Revision</title>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        /* Refined iOS Safari Dark Theme */
        :root {
            --bg: #000000;
            --surface: #1c1c1e;
            --surface-hover: #2c2c2e;
            --text: #ffffff;
            --subtext: #8e8e93;
            --accent: #0a84ff;
            --danger: #ff453a;
            --border: #38383a;
        }
        
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom)) 20px;
            -webkit-font-smoothing: antialiased;
        }

        .screen { display: none; animation: fadeIn 0.3s ease; }
        .active { display: block; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Typography & Headers */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        
        h1 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.5px; }
        h2 { margin: 0 0 16px 0; font-size: 22px; font-weight: 600; }
        
        /* Inputs & Buttons */
        input:not([type="search"]), textarea {
            width: 100%;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            font-size: 17px;
            outline: none;
            transition: border-color 0.2s;
        }
        
        input:focus, textarea:focus { border-color: var(--accent); }
        textarea { min-height: 300px; resize: none; line-height: 1.5; }
        
        /* Search Bar styling */
        .search-bar {
            width: 100%;
            background: var(--surface);
            color: var(--text);
            border: none;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 17px;
            margin-bottom: 20px;
            outline: none;
            -webkit-appearance: none;
        }
        .search-bar::placeholder { color: var(--subtext); }

        button {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.7; }
        
        button.text-btn {
            width: auto;
            background: transparent;
            color: var(--accent);
            padding: 8px 0;
            font-size: 17px;
            font-weight: 500;
            margin: 0;
        }

        /* Floating Controls Container for Reading Mode */
        .floating-controls {
            position: fixed;
            top: max(16px, env(safe-area-inset-top));
            right: 16px;
            display: flex;
            gap: 8px;
            z-index: 9999;
        }

        /* Individual Floating Buttons */
        .floating-btn {
            width: auto;
            background: rgba(28, 28, 30, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: var(--accent);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin: 0;
            transition: background 0.2s;
        }

        /* Note Cards */
        .note-card {
            background: var(--surface);
            padding: 18px;
            border-radius: 16px;
            margin-bottom: 16px;
            position: relative;
            cursor: pointer;
            border: 1px solid transparent;
            transition: transform 0.1s, background 0.2s;
        }
        .note-card:active { transform: scale(0.98); background: var(--surface-hover); }
        .note-card h3 { margin: 0 0 6px 0; font-size: 19px; padding-right: 40px; }
        .note-card p { margin: 0; color: var(--subtext); font-size: 15px; }

        /* Delete Button */
        .delete-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(255, 69, 58, 0.15);
            color: var(--danger);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            padding: 0;
            margin: 0;
        }

        /* Storage status footer */
        #storage-status {
            text-align: center;
            color: var(--subtext);
            font-size: 13px;
            margin-top: 24px;
            padding-bottom: 8px;
        }
        
        /* Revision Tailored Markdown Styling */
        #read-title {
            padding-right: 160px; /* Space for both floating buttons */
            margin-top: 10px;
        }
        #md-content {
            background: var(--surface);
            padding: 24px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 17px;
            letter-spacing: -0.3px;
            overflow-wrap: break-word;
        }
        #md-content h1, #md-content h2, #md-content h3 { margin-top: 1.5em; margin-bottom: 0.5em; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
        #md-content h1:first-child, #md-content h2:first-child { margin-top: 0; }
        #md-content p { margin-bottom: 1.2em; }
        #md-content strong { color: #fff; background: rgba(255,255,255,0.1); padding: 2px 4px; border-radius: 4px; }
        #md-content blockquote { border-left: 4px solid var(--accent); margin: 0 0 1.2em 0; padding: 4px 16px; background: rgba(10, 132, 255, 0.05); border-radius: 0 8px 8px 0; color: #d1d1d6; font-style: italic; }
        #md-content ul, #md-content ol { padding-left: 20px; margin-bottom: 1.2em; }
        #md-content li { margin-bottom: 6px; }
        #md-content img { max-width: 100%; border-radius: 8px; margin: 12px 0; }
        #md-content pre { background: var(--bg); padding: 16px; border-radius: 12px; overflow-x: auto; border: 1px solid var(--border); }
        #md-content code { font-family: ui-monospace, Menlo, monospace; font-size: 15px; background: var(--bg); padding: 2px 6px; border-radius: 6px; }
        #md-content a { color: var(--accent); text-decoration: none; }
    </style>
</head>
<body>

    <!-- Setup Screen -->
    <div id="setup-screen" class="screen active">
        <h1>Setup</h1>
        <p style="color: var(--subtext); margin-bottom: 24px;">Connect your secure GitHub repository.</p>
        <input type="password" id="gh-token" placeholder="GitHub Personal Access Token">
        <input type="text" id="gh-repo" placeholder="username/revision-notes">
        <button onclick="saveSetup()">Connect & Load</button>
    </div>

    <!-- Notes List Screen -->
    <div id="list-screen" class="screen">
        <div class="header-bar">
            <h1>Revisions</h1>
            <button class="text-btn" onclick="nav('add-screen')">＋ Add</button>
        </div>
        
        <!-- Native iOS Style Search Bar -->
        <input type="search" id="search-input" class="search-bar" placeholder="Search notes..." oninput="filterNotes()">
        
        <div id="notes-list"></div>
        <div id="storage-status"></div>
    </div>

    <!-- Add Note Screen -->
    <div id="add-screen" class="screen">
        <div class="header-bar" style="margin-bottom: 16px; border:none; padding:0;">
            <button class="text-btn" onclick="nav('list-screen')">Cancel</button>
            <button class="text-btn" id="save-btn" onclick="saveNote()" style="font-weight: 600;">Save</button>
        </div>
        <input type="text" id="note-title" placeholder="Topic / Module Title">
        <textarea id="note-body" placeholder="Write your revision notes here in Markdown..."></textarea>
    </div>

    <!-- Read Note Screen -->
    <div id="read-screen" class="screen">
        <!-- Floating Controls (Back & Copy) -->
        <div class="floating-controls">
            <button class="floating-btn" id="copy-btn" onclick="copyCurrentNote()">Copy</button>
            <button class="floating-btn" onclick="nav('list-screen')">← Back</button>            
        </div>
        
        <h2 id="read-title"></h2>
        <div id="md-content"></div>
    </div>

    <script>
        const API_BASE = "https://api.github.com/repos";
        const NOTES_FILE = "notes.json";

        let notesData = [];
        let fileSha = null;
        let currentNoteMarkdown = "";   // Raw markdown for copying
        let searchDebounce = null;       // Debounce handle for search input
        let lastSyncedSize = 0;          // Bytes — used by status indicator

        // --- Auth header helper ---
        function authHeaders(token) {
            return {
                "Authorization": `Bearer ${token}`,
                "X-GitHub-Api-Version": "2022-11-28"
            };
        }

        /*
         * Async base64 helpers.
         *
         * The previous app used btoa(unescape(encodeURIComponent(...))) and the
         * inverse — that breaks down on multi-megabyte strings (slow, deprecated,
         * and prone to call-stack issues). These versions use Blob + FileReader
         * for encoding and a data: URL for decoding, which:
         *   - Stay UTF-8 safe (Blob defaults to UTF-8 when given a string).
         *   - Run off the synchronous path so the UI doesn't freeze.
         *   - Handle arbitrarily large strings.
         */
        function encodeBase64(str) {
            return new Promise((resolve, reject) => {
                const blob = new Blob([str], { type: 'application/octet-stream' });
                const reader = new FileReader();
                reader.onload = () => {
                    // result looks like "data:...;base64,XXXX"
                    const result = reader.result;
                    resolve(result.slice(result.indexOf(',') + 1));
                };
                reader.onerror = () => reject(new Error("Base64 encode failed"));
                reader.readAsDataURL(blob);
            });
        }

        async function decodeBase64(b64) {
            // GitHub wraps base64 at 60 chars with newlines — strip whitespace.
            const clean = b64.replace(/\s/g, '');
            const res = await fetch(`data:application/octet-stream;base64,${clean}`);
            const blob = await res.blob();
            return await blob.text(); // UTF-8 decode
        }

        // --- Navigation ---
        function nav(screenId) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            window.scrollTo(0, 0);
        }

        function init() {
            const token = localStorage.getItem('gh_token');
            const repo = localStorage.getItem('gh_repo');
            if (token && repo) {
                document.getElementById('gh-token').value = token;
                document.getElementById('gh-repo').value = repo;
                fetchNotes();
            }
        }

        function saveSetup() {
            const token = document.getElementById('gh-token').value.trim();
            const repo = document.getElementById('gh-repo').value.trim();
            if (!token || !repo) return alert('Please fill both fields');
            
            localStorage.setItem('gh_token', token);
            localStorage.setItem('gh_repo', repo);
            fetchNotes();
        }

        /*
         * fetchNotes — handles BOTH small and large files.
         *
         * GitHub's Contents API only inlines content for files <= 1 MB. Above
         * that, the same JSON response comes back with `content: ""` and
         * `encoding: "none"`. To support up to 100 MB we make a second request
         * to the same endpoint with `Accept: application/vnd.github.raw`,
         * which streams the file body directly. We still need the metadata
         * call first because the SHA it returns is required for the next PUT.
         */
        async function fetchNotes() {
            nav('list-screen');
            const listEl = document.getElementById('notes-list');
            listEl.innerHTML = "<p style='color: var(--subtext); text-align: center; margin-top: 40px;'>Loading notes securely...</p>";
            document.getElementById('storage-status').textContent = "";
            
            const token = localStorage.getItem('gh_token');
            const repo = localStorage.getItem('gh_repo');

            try {
                // Step 1: metadata (gives us the SHA, plus content if <= 1MB)
                const res = await fetch(`${API_BASE}/${repo}/contents/${NOTES_FILE}`, {
                    headers: { ...authHeaders(token), "Accept": "application/vnd.github+json" }
                });

                if (res.status === 404) {
                    notesData = [];
                    fileSha = null;
                    lastSyncedSize = 0;
                    renderList();
                    return;
                }
                if (!res.ok) {
                    throw new Error(`Auth failed (${res.status}). Check your token & repo name.`);
                }

                const meta = await res.json();
                fileSha = meta.sha;
                lastSyncedSize = meta.size || 0;

                let jsonText;
                if (meta.encoding === 'base64' && meta.content) {
                    // Small file path — content is inlined
                    jsonText = await decodeBase64(meta.content);
                } else {
                    // Large file path (> 1 MB) — refetch raw. Same endpoint,
                    // different Accept header, supports up to 100 MB.
                    const rawRes = await fetch(`${API_BASE}/${repo}/contents/${NOTES_FILE}`, {
                        headers: { ...authHeaders(token), "Accept": "application/vnd.github.raw" }
                    });

                    if (rawRes.ok) {
                        jsonText = await rawRes.text();
                    } else {
                        // Fallback for very old GH Enterprise instances:
                        // use the Git Data API (blobs by SHA, also up to 100 MB).
                        const blobRes = await fetch(`${API_BASE}/${repo}/git/blobs/${meta.sha}`, {
                            headers: { ...authHeaders(token), "Accept": "application/vnd.github.raw" }
                        });
                        if (!blobRes.ok) {
                            throw new Error(`Could not load large notes file (${rawRes.status}).`);
                        }
                        jsonText = await blobRes.text();
                    }
                }

                notesData = JSON.parse(jsonText);
                renderList();
            } catch (err) {
                alert("Connection failed: " + err.message);
                nav('setup-screen');
            }
        }

        // Debounced search — avoids re-scanning a multi-MB dataset on every keystroke
        function filterNotes() {
            clearTimeout(searchDebounce);
            searchDebounce = setTimeout(() => {
                const query = document.getElementById('search-input').value.toLowerCase().trim();
                if (!query) {
                    renderList();
                    return;
                }
                const filtered = notesData.filter(note =>
                    (note.title && note.title.toLowerCase().includes(query)) ||
                    (note.content && note.content.toLowerCase().includes(query))
                );
                renderList(filtered);
            }, 180);
        }

        function formatSize(bytes) {
            if (!bytes) return '0 B';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1024 / 1024).toFixed(2) + ' MB';
        }

        function renderList(notesToRender = notesData) {
            const listEl = document.getElementById('notes-list');
            listEl.innerHTML = '';

            // Update status footer
            const statusEl = document.getElementById('storage-status');
            if (notesData.length > 0) {
                const noteWord = notesData.length === 1 ? 'note' : 'notes';
                statusEl.textContent = `${notesData.length} ${noteWord} · ${formatSize(lastSyncedSize)} synced`;
            } else {
                statusEl.textContent = '';
            }

            if (notesToRender.length === 0) {
                if (notesData.length === 0) {
                    listEl.innerHTML = "<p style='color: var(--subtext); text-align: center; margin-top: 40px;'>No notes yet. Tap + to start revising.</p>";
                } else {
                    listEl.innerHTML = "<p style='color: var(--subtext); text-align: center; margin-top: 40px;'>No matching notes found.</p>";
                }
                return;
            }

            // Build off-DOM, then attach once — avoids reflow per card
            const frag = document.createDocumentFragment();
            notesToRender.forEach(note => {
                const card = document.createElement('div');
                card.className = 'note-card';
                card.onclick = () => openNote(note.id);
                
                const title = document.createElement('h3');
                title.textContent = note.title;
                
                const date = document.createElement('p');
                date.textContent = note.date;

                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.innerHTML = '×';
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteNote(note.id);
                };

                card.appendChild(title);
                card.appendChild(date);
                card.appendChild(delBtn);
                frag.appendChild(card);
            });
            listEl.appendChild(frag);
        }

        function openNote(id) {
            const note = notesData.find(n => n.id === id);
            if (!note) return;
            
            currentNoteMarkdown = note.content;
            document.getElementById('copy-btn').textContent = "Copy";
            document.getElementById('read-title').textContent = note.title;

            // For huge notes, marked.parse can take a moment. Show a placeholder
            // and yield to the paint queue so the navigation feels instant.
            const mdEl = document.getElementById('md-content');
            mdEl.innerHTML = "<p style='color: var(--subtext);'>Rendering…</p>";
            nav('read-screen');
            setTimeout(() => {
                try {
                    mdEl.innerHTML = marked.parse(note.content || "");
                } catch (e) {
                    mdEl.textContent = note.content || "";
                }
            }, 10);
        }

        async function copyCurrentNote() {
            try {
                await navigator.clipboard.writeText(currentNoteMarkdown);
                const copyBtn = document.getElementById('copy-btn');
                copyBtn.textContent = "Copied!";
                setTimeout(() => {
                    if (copyBtn.textContent === "Copied!") {
                        copyBtn.textContent = "Copy";
                    }
                }, 2000);
            } catch (err) {
                alert("Failed to copy text.");
            }
        }

        async function syncToGitHub(updatedData, commitMessage) {
            const token = localStorage.getItem('gh_token');
            const repo = localStorage.getItem('gh_repo');

            const jsonString = JSON.stringify(updatedData, null, 2);
            const encodedContent = await encodeBase64(jsonString);

            const res = await fetch(`${API_BASE}/${repo}/contents/${NOTES_FILE}`, {
                method: 'PUT',
                headers: {
                    ...authHeaders(token),
                    "Accept": "application/vnd.github+json",
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: commitMessage,
                    content: encodedContent,
                    sha: fileSha || undefined
                })
            });

            if (!res.ok) {
                let detail = "";
                try { detail = (await res.json()).message || ""; } catch (_) {}
                throw new Error(`Sync failed (${res.status}). ${detail}`);
            }

            const data = await res.json();
            fileSha = data.content.sha;
            lastSyncedSize = data.content.size || jsonString.length;
            notesData = updatedData;
        }

        async function saveNote() {
            const titleEl = document.getElementById('note-title');
            const bodyEl = document.getElementById('note-body');
            const btn = document.getElementById('save-btn');
            
            if (!titleEl.value || !bodyEl.value) return alert("Please enter a title and content.");

            btn.textContent = "Saving...";
            btn.style.opacity = "0.5";
            btn.disabled = true;

            const newNote = {
                id: Date.now().toString(),
                title: titleEl.value,
                content: bodyEl.value,
                date: new Date().toLocaleDateString()
            };

            const updatedNotes = [newNote, ...notesData];

            try {
                await syncToGitHub(updatedNotes, `Add note: ${newNote.title}`);
                titleEl.value = "";
                bodyEl.value = "";
                document.getElementById('search-input').value = ""; 
                renderList();
                nav('list-screen');
            } catch (err) {
                alert(err.message);
            } finally {
                btn.textContent = "Save";
                btn.style.opacity = "1";
                btn.disabled = false;
            }
        }

        async function deleteNote(id) {
            if (!confirm("Are you sure you want to delete this note?")) return;

            document.getElementById('notes-list').style.opacity = "0.5";

            const noteToDelete = notesData.find(n => n.id === id);
            const updatedNotes = notesData.filter(n => n.id !== id);

            try {
                await syncToGitHub(updatedNotes, `Delete note: ${noteToDelete.title}`);
                filterNotes(); 
            } catch (err) {
                alert(err.message);
            } finally {
                document.getElementById('notes-list').style.opacity = "1";
            }
        }

        init();
    </script>
</body>
</html>
